<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — Dayflow HRMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="profile" data-require-role="any">

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><span class="brand-mark"><i class="fa-solid fa-diagram-project"></i></span><span class="brand-name">Dayflow</span></div>
    <div class="sidebar-user">
      <div class="avatar-sm" data-user-initials>--</div>
      <div><div class="u-name" data-user-name>—</div><div class="u-role" data-user-role>—</div></div>
    </div>
    <nav class="side-nav">
      <div class="nav-label">Main</div>
      <a href="employee-dashboard.html" id="navDashboardLink" class="side-link" data-nav="dashboard"><i class="fa-solid fa-grip"></i> Dashboard</a>
      <a href="profile.html" class="side-link" data-nav="profile"><i class="fa-solid fa-user"></i> My Profile</a>
      <a href="attendance.html" class="side-link" data-nav="attendance"><i class="fa-solid fa-calendar-check"></i> Attendance</a>
      <a href="leave.html" class="side-link" data-nav="leave"><i class="fa-solid fa-plane-departure"></i> Leave</a>
      <a href="payroll.html" class="side-link" data-nav="payroll"><i class="fa-solid fa-money-check-dollar"></i> Payroll</a>
    </nav>
    <div class="sidebar-bottom">
      <button class="btn btn-ghost btn-block" data-logout style="color:#CFCDF0;justify-content:flex-start;"><i class="fa-solid fa-arrow-right-from-bracket"></i> Log Out</button>
    </div>
  </aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle" id="sidebarToggle"><i class="fa-solid fa-bars"></i></button>
        <div><div class="page-title">My Profile</div><div class="page-sub" data-today>—</div></div>
      </div>
      <div class="topbar-right">
        <div class="topbar-user"><div class="avatar-sm" data-user-initials>--</div></div>
      </div>
    </header>

    <div class="content" id="profilePage">
      <div class="grid-2">
        <div class="card">
          <div class="profile-head">
            <div class="avatar-lg" id="profInitials">--</div>
            <div>
              <h2 id="profName">—</h2>
              <p class="text-muted mb-0" id="profDesignation">—</p>
              <div class="profile-tags">
                <span class="badge badge-info" id="profId">—</span>
                <span class="badge badge-neutral" id="profDept">—</span>
              </div>
            </div>
          </div>
          <button class="btn btn-primary mt-24" id="openEditProfile"><i class="fa-solid fa-pen"></i> Edit Profile</button>
        </div>

        <div class="card">
          <div class="card-title"><h3>Personal Information</h3></div>
          <div class="info-list">
            <div class="info-row"><span class="k"><i class="fa-regular fa-envelope"></i> Email</span><span class="v" id="infoEmail">—</span></div>
            <div class="info-row"><span class="k"><i class="fa-solid fa-phone"></i> Phone</span><span class="v" id="infoPhone">—</span></div>
            <div class="info-row"><span class="k"><i class="fa-solid fa-location-dot"></i> Location</span><span class="v" id="infoLocation">—</span></div>
            <div class="info-row"><span class="k"><i class="fa-solid fa-user-tie"></i> Reporting Manager</span><span class="v" id="infoManager">—</span></div>
            <div class="info-row"><span class="k"><i class="fa-regular fa-calendar"></i> Date of Joining</span><span class="v" id="infoJoinDate">—</span></div>
            <div class="info-row"><span class="k"><i class="fa-solid fa-cake-candles"></i> Date of Birth</span><span class="v" id="infoDob">—</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="editProfileModal">
  <div class="modal">
    <div class="modal-head"><h3>Edit Profile</h3><button class="modal-close" data-close-modal><i class="fa-solid fa-xmark"></i></button></div>
    <form id="editProfileForm">
      <div class="modal-body">
        <div class="field no-icon">
          <label for="editEmail">Email</label>
          <input type="email" id="editEmail" required>
        </div>
        <div class="field no-icon">
          <label for="editPhone">Phone</label>
          <input type="text" id="editPhone" required>
        </div>
        <div class="field no-icon">
          <label for="editLocation">Location</label>
          <input type="text" id="editLocation" required>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" data-close-modal>Cancel</button>
        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-check"></i> Save Changes</button>
      </div>
    </form>
  </div>
</div>

<div id="toast"></div>
<script src="js/script.js"></script>
</body>
</html>
